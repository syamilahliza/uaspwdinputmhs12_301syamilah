<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIVERSITAS INDRAPRASTA PGRI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        iframe {
            border: 2px solid #999;
            display: block;
        }
        
        #header {
            width: 100%;
            height: 120px;
        }
        
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        #menu {
            width: 220px;
            height: 100%;
        }
        
        #content {
            flex: 1;
            height: 100%;
        }
        
        #footer {
            width: 100%;
            height: 60px;
        }
    </style>
</head>
<body>
    <iframe id="header" src="header.html" name="header"></iframe>
    
    <div class="main-container">
        <iframe id="menu" src="menu.html" name="menu"></iframe>
        <iframe id="content" src="content.html" name="content"></iframe>
    </div>
    
    <iframe id="footer" src="footer.html" name="footer"></iframe>
</body>
</html>
